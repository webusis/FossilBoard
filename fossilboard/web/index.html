<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FossilBoard</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='3' width='4' height='10' rx='1' fill='%23E95420'/><rect x='6.5' y='3' width='4' height='7' rx='1' fill='%2377216F'/><rect x='12' y='3' width='3' height='4' rx='1' fill='%234C9A2A'/></svg>">
</head>
<body>

<!-- инлайновые иконки: свои SVG, currentColor, лицензия не нужна -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-add" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 16 16"><path d="M11.5 2.5l2 2L6 12l-3 1 1-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-move" viewBox="0 0 16 16"><path d="M2 8h12M9 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.5h-7a1 1 0 0 0-1 1v7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-attach" viewBox="0 0 16 16"><path d="M10.5 4.5L6 9a1.8 1.8 0 0 0 2.5 2.5L13 7a3 3 0 1 0-4.2-4.2L3.6 8a4.2 4.2 0 0 0 6 6l3.7-3.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-diff" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 7h4M4.5 9.5h7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V6H9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-settings" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-child" viewBox="0 0 16 16"><path d="M3 3v10h6M6 10l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-rake" viewBox="0 0 16 16"><path d="M8 2.4l6.2 11.2H1.8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.4v3.1M8 11.3v.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-dead" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.7" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.7 5.7l4.6 4.6M10.3 5.7l-4.6 4.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 16 16"><rect x="1" y="3" width="4" height="10" rx="1" fill="#E95420"/><rect x="6.5" y="3" width="4" height="7" rx="1" fill="#77216F"/><rect x="12" y="3" width="3" height="4" rx="1" fill="#4C9A2A"/></svg>
    <b>FossilBoard</b>
    <span class="version" id="version"></span>
  </div>
  <label class="field">
    <span>проект</span>
    <select id="project-select"></select>
  </label>
  <button class="icon-btn" id="new-repo" title="создать репу с доской (+ новая репа)">+</button>
  <button class="icon-btn" id="open-repo" title="открыть существующую репу (⌘O)">
    <svg width="16" height="16" viewBox="0 0 16 16"><path d="M1.5 4.5h4l1.5 2h7.5v6a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </button>
  <code class="repo-path" id="repo-path" title="репозиторий проекта"></code>
  <span class="spacer"></span>
  <label class="field">
    <span>поиск</span>
    <input id="search" type="search" placeholder="текст карточки">
  </label>
  <label class="field">
    <span>модуль</span>
    <select id="module-filter"><option value="">все</option></select>
  </label>
  <label class="field">
    <span>сессия</span>
    <select id="session-filter"><option value="">любая</option></select>
  </label>
  <label class="check"><input type="checkbox" id="parents-filter"> с саб-задачами</label>
  <button class="icon-btn" id="refresh" title="обновить (⟳)"><svg width="16" height="16"><use href="#i-refresh"/></svg></button>
  <button class="icon-btn" id="settings" title="модули и колонки (⚙)"><svg width="16" height="16"><use href="#i-settings"/></svg></button>
</header>

<div class="toolbar">
  <button class="btn accent" id="new-task"><svg width="14" height="14"><use href="#i-add"/></svg> новая карточка</button>
  <span class="board-meta" id="board-meta"></span>
</div>

<main id="board" class="board"></main>

<!-- панель карточки -->
<aside id="detail" class="detail" hidden>
  <div class="detail-head">
    <code class="task-id" id="d-id"></code>
    <select id="d-column" class="mini"></select>
    <button class="icon-btn" id="d-close" title="закрыть (Esc)"><svg width="16" height="16"><use href="#i-close"/></svg></button>
  </div>
  <div class="detail-body">
    <input id="d-title" class="title-input" placeholder="заголовок">
    <div class="row">
      <label class="field"><span>модуль</span><select id="d-module" class="mini"></select></label>
      <label class="field"><span>оценка, ч</span><input id="d-estimate" class="mini num" type="number" step="0.25" min="0"></label>
      <label class="field"><span>сессия</span><input id="d-session" class="mini" placeholder="вечер / ночь"></label>
    </div>
    <textarea id="d-desc" rows="6" placeholder="описание в markdown…"></textarea>
    <div class="row">
      <button class="btn" id="d-save"><svg width="14" height="14"><use href="#i-edit"/></svg> сохранить</button>
      <button class="btn" id="d-preview-toggle">предпросмотр</button>
      <button class="btn" id="d-addsub"><svg width="14" height="14"><use href="#i-child"/></svg> саб-задача</button>
      <span class="spacer"></span>
      <button class="btn danger" id="d-delete"><svg width="14" height="14"><use href="#i-trash"/></svg> удалить</button>
    </div>
    <div id="d-preview" class="markdown" hidden></div>

    <section class="block">
      <h3>грабли <span id="d-gotchacount" class="pill"></span></h3>
      <ul id="d-gotchas" class="notes"></ul>
    </section>

    <section class="block">
      <h3>неудачные пути <span id="d-attemptcount" class="pill"></span></h3>
      <ul id="d-attempts" class="notes"></ul>
    </section>

    <section class="block">
      <h3>саб-задачи <span id="d-progress" class="pill"></span></h3>
      <ul id="d-subtasks" class="subtasks"></ul>
    </section>

    <section class="block">
      <h3>вложения <span id="d-attcount" class="pill"></span></h3>
      <div id="dropzone" class="dropzone">перетащи файл сюда или <button class="link-btn" id="d-pick">выбери</button><input type="file" id="d-file" hidden multiple></div>
      <ul id="d-attachments" class="attachments"></ul>
    </section>

    <section class="block">
      <h3>коммиты <span id="d-commitcount" class="pill"></span></h3>
      <ul id="d-commits" class="commits"></ul>
    </section>

    <section class="block">
      <h3>история</h3>
      <ol id="d-timeline" class="timeline"></ol>
    </section>
  </div>
</aside>

<!-- панель модулей -->
<aside id="modules-panel" class="detail" hidden>
  <div class="detail-head">
    <b>модули и колонки</b>
    <span class="spacer"></span>
    <button class="icon-btn" id="m-close"><svg width="16" height="16"><use href="#i-close"/></svg></button>
  </div>
  <div class="detail-body">
    <h3>модули</h3>
    <ul id="m-list" class="modules-list"></ul>
    <div class="row">
      <input id="m-name" class="mini" placeholder="название">
      <input id="m-color" class="mini color" type="color" value="#88ccee">
      <button class="btn" id="m-add"><svg width="14" height="14"><use href="#i-add"/></svg> добавить</button>
    </div>
    <h3>колонки</h3>
    <ul id="c-list" class="modules-list"></ul>
  </div>
</aside>

<div id="toast" class="toast" hidden></div>

<dialog id="repo-dialog" class="prompt repo-dialog">
  <form method="dialog" id="repo-form">
    <h3 id="repo-title">Новая репа</h3>
    <label class="repo-field">
      <span>путь к репозиторию</span>
      <input id="repo-new-path" class="mono" placeholder="/home/user/projects/my-game" autocomplete="off" spellcheck="false">
    </label>
    <ul id="repo-suggest" class="repo-suggest" hidden></ul>
    <p id="repo-status" class="repo-status"></p>
    <div class="row repo-row">
      <label class="repo-field small"><span>префикс</span><input id="repo-id" class="mono" placeholder="GAME" maxlength="12"></label>
      <label class="repo-field small"><span>имя</span><input id="repo-name" placeholder="Мой проект"></label>
    </div>
    <menu>
      <button value="cancel" class="btn">отмена</button>
      <button value="ok" class="btn accent" id="repo-ok">создать</button>
    </menu>
  </form>
</dialog>

<dialog id="prompt-dialog" class="prompt">
  <form method="dialog">
    <h3 id="prompt-title">Введите значение</h3>
    <input id="prompt-input" class="mini" autocomplete="off">
    <menu>
      <button value="cancel" class="btn">отмена</button>
      <button value="ok" class="btn accent" id="prompt-ok">ок</button>
    </menu>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
